</head><body><main><h1>洋食屋・オムライスの見本 5案</h1><p>弊社で作成しているホームページの見本です。店名・住所・電話番号・お料理と値段は架空のもので、写真は写真素材です。</p>
<a class="c" href="1/"><b>見本1 白い紙・明朝</b><span>白い紙に明朝の文字。看板料理の量と値段を表で見せる</span></a>
<a class="c" href="2/"><b>見本2 こげ茶・写真たくさん</b><span>こげ茶の地に、お料理の写真をたくさん。夜の洋食屋の落ち着き</span></a>
<a class="c" href="3/"><b>見本3 白・すっきり</b><span>白い地にゴシック。大きなボタンで、迷わず探せる</span></a>
<a class="c" href="4/"><b>見本4 大きな写真1枚</b><span>暗めの地に、画面いっぱいの写真1枚。店名を写真に重ねる</span></a>
<a class="c" href="5/"><b>見本5 卵色・明るく</b><span>卵の黄色を地に。丸みのある文字で、家族で入りやすい雰囲気</span></a>
</main></body></html>
